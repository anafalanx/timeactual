name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # CI supplies the one file developers copy into the project root.
      - name: Place pinned Kuu in the project root
        run: |
          Invoke-WebRequest -Uri 'https://github.com/anafalanx/kuu/releases/download/0.9.0/kuu.exe' -OutFile kuu.exe
          $expected = '5348fb46f934a637081117159eeb9b98a639a848b408b2ffb392d85f4c0a1f55'
          if ((Get-FileHash -LiteralPath kuu.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Kuu checksum mismatch'
          }

      - uses: actions/cache@v4
        with:
          path: .tools
          key: timeactual-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/prereqs.json', 'tools/prereqs.lua', 'tools/install.lua', 'tools/project.lua', 'tools/tcltk.lua') }}

      - name: Validate task declarations
        run: |
          .\kuu.exe check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\kuu.exe list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test the complete application
        run: .\kuu.exe run test
